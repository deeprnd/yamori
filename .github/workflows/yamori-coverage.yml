name: Yamori Coverage Validation

'on':
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  coverage:
    name: Tests / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Build and run coverage tests
        run: just test-cov-yamori

      - name: Generate coverage summary
        run: |
          python3 contrib/tool/coverage_report.py coverage-yamori             build/yamori-cov/kcov/merged             build/yamori-cov/coverage-summary.json             --config contrib/test/coverage-yamori.json

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: yamori-coverage
          path: |
            build/yamori-cov/coverage-summary.json
            build/yamori-cov/kcov/merged/

name: Coverage Stage (yamori)

'on':
  workflow_call:

jobs:
  coverage:
    name: Tests / Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Run coverage test
        run: just test-cov-yamori
